version: '3.8'

services:
  app:
    image: openjdk:21-jdk-slim
    container_name: proxy-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DEBUG=false
      - ACCESS_TOKEN=your-token-here
    depends_on:
      - redis
    networks:
      - app_network

  redis:
    image: "redis:latest"
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
